name: BassPlayer
options:
  bundleIdPrefix: com.muzam2
  deploymentTarget:
    visionOS: "26.0"   # Scene.restorationBehavior needs 26; the owner's device runs 27
    tvOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Unsigned builds: the IPA is re-signed on the device by SideStore / iloader / atvloadly.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""

packages:
  # FFmpeg-based player, vendored from the GPLv3 branch (the open-source tree with visionOS
  # support; `main` ships a binary core without an xros slice) and patched for Dolby Vision
  # profile 5. See Vendor/KSPlayer/UPSTREAM_COMMIT.
  KSPlayer:
    path: Vendor/KSPlayer
  # SMB client (libsmb2, LGPL-2.1) for NAS browsing and the loopback SMBBridge; replaces
  # FFmpeg's libsmbclient, which FFmpegKit 9 no longer ships.
  AMSMB2:
    path: Vendor/AMSMB2   # 4.0.3, vendored to make the product static (see its Package.swift)

schemes:
  # Explicit scheme so `xcodebuild test -scheme BassPlayer` runs the UI tests in the simulator
  # (e2e-tests.yml). The tvOS scheme stays auto-generated.
  BassPlayer:
    build:
      targets:
        BassPlayer: all
        BassPlayerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BassPlayerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  # ---------------- End-to-end UI tests (visionOS simulator, CI) ----------------
  BassPlayerUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources:
      - path: BassPlayerUITests
    dependencies:
      - target: BassPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muzam2.bassplayer.uitests
        TEST_TARGET_NAME: BassPlayer
        TARGETED_DEVICE_FAMILY: "7"
        SUPPORTED_PLATFORMS: "xros xrsimulator"

  # ---------------- Apple Vision Pro ----------------
  BassPlayer:
    type: application
    platform: visionOS
    sources:
      - path: BassPlayer
        excludes:
          - "Info*.plist"
          - "**/*.usda"
    dependencies:
      - package: KSPlayer
        product: KSPlayer
      - package: AMSMB2
        product: AMSMB2
    info:
      path: BassPlayer/Info.plist
      properties:
        CFBundleDisplayName: Bass Player
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Bass Player streams the low-frequency channel of your film to a subwoofer receiver over Bluetooth.
        NSLocalNetworkUsageDescription: Bass Player connects to your Jellyfin or Plex server and your NAS on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muzam2.bassplayer
        TARGETED_DEVICE_FAMILY: "7"
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        ENABLE_PREVIEWS: "YES"

  # ---------------- Apple TV ----------------
  BassPlayerTV:
    type: application
    platform: tvOS
    sources:
      - path: BassPlayer
        excludes:
          - "Info*.plist"
          - "**/*.usda"
    dependencies:
      - package: KSPlayer
        product: KSPlayer
      - package: AMSMB2
        product: AMSMB2
    info:
      path: BassPlayer/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Bass Player
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Bass Player streams the low-frequency channel of your film to a subwoofer receiver over Bluetooth.
        NSLocalNetworkUsageDescription: Bass Player connects to your Jellyfin or Plex server and your NAS on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_NAME: BassPlayerTV
        PRODUCT_BUNDLE_IDENTIFIER: com.muzam2.bassplayer.tv
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        ENABLE_PREVIEWS: "YES"
