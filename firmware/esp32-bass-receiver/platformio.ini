; ESP32 subwoofer receiver: BLE in → PCM5102A I²S DAC out.
; Build/flash from Linux/Windows: `pio run -t upload` (PlatformIO).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
