; ESP32 subwoofer receiver: BLE in → I²S DAC out.
; Build/flash from Linux/Windows with PlatformIO:
;   pio run -e esp32-a1s -t upload     (ESP32-A1S Audio Kit, ES8388 codec)
;   pio run -e esp32dev  -t upload     (generic ESP32 + PCM5102A board)

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Generic ESP32 dev board + PCM5102A
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DOUT_RATE=8000

; AI-Thinker ESP32-A1S Audio Kit (ES8388 variant). The 3.5 mm jack is the line out.
[env:esp32-a1s]
board = esp32dev
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DBOARD_A1S
    -DOUT_RATE=16000
