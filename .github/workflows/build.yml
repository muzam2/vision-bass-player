name: Build unsigned IPAs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    # xcode-27 image: Xcode 27.x with the visionOS 27 / tvOS 27 SDKs, matching the owner's
    # devices (macos-15 stops at Xcode 26.3 / visionOS 26.2).
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: visionOS
            scheme: BassPlayer
            destination: generic/platform=visionOS
            app: BassPlayer.app
            suffix: visionos
          - name: tvOS
            scheme: BassPlayerTV
            destination: generic/platform=tvOS
            app: BassPlayerTV.app
            suffix: tvos

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -Ei "xros|appletvos" || true

      # TEMPORARY (frame-pacing-timestamped): what the SDK really declares for the queued
      # sample-buffer renderers, so the code is written against facts. Removed before merge.
      - name: Probe SDK declarations (temporary)
        if: matrix.suffix == 'visionos'
        run: |
          mkdir -p sdk-probe
          for sdk in xros appletvos; do
            P=$(xcrun --sdk $sdk --show-sdk-path)
            echo "$sdk: $P"
            H="$P/System/Library/Frameworks/AVFoundation.framework/Headers"
            for f in AVSampleBufferVideoRenderer.h AVQueuedSampleBufferRendering.h AVSampleBufferRenderSynchronizer.h AVSampleBufferDisplayLayer.h AVVideoPerformanceMetrics.h; do
              cp "$H/$f" "sdk-probe/$sdk-$f" 2>/dev/null || echo "missing $f in $sdk"
            done
            find "$P/System/Library/Frameworks/AVFoundation.framework" "$P/usr/lib/swift/AVFoundation.swiftmodule" -name "*.swiftinterface" 2>/dev/null | head -4 | while read -r i; do
              cp "$i" "sdk-probe/$sdk-$(basename "$(dirname "$i")")-$(basename "$i")"
            done
            H2="$P/System/Library/Frameworks/CoreMedia.framework/Headers"
            cp "$H2/CMSync.h" "sdk-probe/$sdk-CMSync.h" 2>/dev/null || true
          done
          ls -la sdk-probe

      - name: Upload SDK probe (temporary)
        if: matrix.suffix == 'visionos'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-probe
          path: sdk-probe/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache FFmpegKit binaries
        uses: actions/cache@v4
        with:
          path: |
            Vendor/FFmpegKit/Sources/*.xcframework
            Vendor/FFmpegKit/Sources/FFmpegKit
          key: ffmpegkit-${{ hashFiles('Vendor/FFmpegKit/checksums.json', 'Vendor/FFmpegKit/RELEASE_TAG') }}

      - name: Fetch FFmpegKit binaries (release zips, checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Vendor/FFmpegKit/tools/fetch_binaries.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ matrix.suffix }}-${{ hashFiles('project.yml', 'Vendor/KSPlayer/Package.swift', 'Vendor/FFmpegKit/Package.swift', 'Vendor/FFmpegKit/checksums.json') }}
          restore-keys: spm-${{ matrix.suffix }}-

      - name: Resolve Swift packages
        run: |
          # SwiftPM sometimes fails extracting many binary targets at once ("... already exists
          # in file system" in its artifact cache); a second pass picks up the cached zips.
          set -o pipefail
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                 -project BassPlayer.xcodeproj \
                 -scheme "${{ matrix.scheme }}" \
                 -clonedSourcePackagesDirPath SourcePackages \
                 -skipMacroValidation > resolve.log 2>&1; then
              tail -n 30 resolve.log
              exit 0
            fi
            echo "resolve attempt $attempt failed:"
            grep -E "error|failed" resolve.log | cut -c1-300 | head -5
          done
          tail -n 40 resolve.log
          exit 1

      - name: Build ${{ matrix.name }} (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BassPlayer.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build-${{ matrix.suffix }}.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-${{ matrix.suffix }}.log

      # TEMPORARY (frame-pacing-timestamped): the compiler's view of the new code.
      - name: Warnings in the frame-pacing code (temporary)
        if: always()
        run: |
          grep -E "warning:" build-${{ matrix.suffix }}.log | grep -E "TimestampedVideoPresenter|MetalPlayView|FramePacing" | sed -E 's#^.*/(Vendor|BassPlayer)/#\1/#' | sort -u > pacing-warnings-${{ matrix.suffix }}.txt || true
          wc -l pacing-warnings-${{ matrix.suffix }}.txt
          cat pacing-warnings-${{ matrix.suffix }}.txt | cut -c1-400

      - name: Upload warnings (temporary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacing-warnings-${{ matrix.suffix }}
          path: pacing-warnings-${{ matrix.suffix }}.txt
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "${{ matrix.app }}" -type d | head -n1)
          test -n "$APP" || { echo "No .app found"; exit 1; }
          echo "App at: $APP"
          du -sh "$APP"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")"
          ls -lh "$BIN"
          # macOS `strings` skips the load commands; otool -L lists the dylibs the binary loads.
          otool -L "$BIN" | sed -n '2,$p' | awk '{print "  loads " $1}'
          if otool -L "$BIN" | grep -q "Libavcodec.framework" || strings - "$BIN" | grep -q "avcodec_open2"; then echo "FFmpeg: linked"; else echo "FFmpeg: NOT FOUND in binary"; exit 1; fi
          # Every dynamic framework the binary loads must be embedded, or the app dies in dyld at launch.
          missing=0
          for fw in $(otool -L "$BIN" | grep -o '@rpath/[^/]*\.framework' | sort -u); do
            name=$(basename "$fw" .framework)
            if [ -d "$APP/Frameworks/$name.framework" ]; then echo "embedded: $name"; else echo "MISSING embedded framework: $name"; missing=1; fi
          done
          test "$missing" = 0
          ls "$APP/Frameworks" 2>/dev/null || echo "(no embedded frameworks)"
          # Which FFmpeg the app ships (av_version_info(), from the embedded Libavutil).
          strings - "$APP/Frameworks/Libavutil.framework/Libavutil" | grep -oE "FFmpeg version [^ ]+$" | head -n1 | grep . || { echo "no FFmpeg version string in the embedded Libavutil"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          zip -qry "BassPlayer-${VERSION}-${{ matrix.suffix }}-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BassPlayer-${{ matrix.suffix }}-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.suffix }}
          path: build-${{ matrix.suffix }}.log

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
