name: Build unsigned IPAs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: visionOS
            scheme: BassPlayer
            destination: generic/platform=visionOS
            app: BassPlayer.app
            suffix: visionos
          - name: tvOS
            scheme: BassPlayerTV
            destination: generic/platform=tvOS
            app: BassPlayerTV.app
            suffix: tvos

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -Ei "xros|appletvos" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ matrix.suffix }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ matrix.suffix }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BassPlayer.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipMacroValidation | tail -n 20

      - name: Build ${{ matrix.name }} (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BassPlayer.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build-${{ matrix.suffix }}.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-${{ matrix.suffix }}.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "${{ matrix.app }}" -type d | head -n1)
          test -n "$APP" || { echo "No .app found"; exit 1; }
          echo "App at: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          zip -qry "BassPlayer-${VERSION}-${{ matrix.suffix }}-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BassPlayer-${{ matrix.suffix }}-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.suffix }}
          path: build-${{ matrix.suffix }}.log

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
