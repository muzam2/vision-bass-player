name: Build unsigned IPAs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    # xcode-27 image: Xcode 27.x with the visionOS 27 / tvOS 27 SDKs, matching the owner's
    # devices (macos-15 stops at Xcode 26.3 / visionOS 26.2).
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: visionOS
            scheme: BassPlayer
            destination: generic/platform=visionOS
            app: BassPlayer.app
            suffix: visionos
          - name: tvOS
            scheme: BassPlayerTV
            destination: generic/platform=tvOS
            app: BassPlayerTV.app
            suffix: tvos

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -Ei "xros|appletvos" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache FFmpegKit binaries
        uses: actions/cache@v4
        with:
          path: Vendor/FFmpegKit/Sources/*.xcframework
          key: ffmpegkit-${{ hashFiles('Vendor/FFmpegKit/checksums.json', 'Vendor/FFmpegKit/RELEASE_TAG') }}

      - name: Fetch FFmpegKit binaries (release zips, checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Vendor/FFmpegKit/tools/fetch_binaries.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ matrix.suffix }}-${{ hashFiles('project.yml', 'Vendor/KSPlayer/Package.swift', 'Vendor/FFmpegKit/Package.swift', 'Vendor/FFmpegKit/checksums.json') }}
          restore-keys: spm-${{ matrix.suffix }}-

      - name: Resolve Swift packages
        run: |
          # SwiftPM sometimes fails extracting many binary targets at once ("... already exists
          # in file system" in its artifact cache); a second pass picks up the cached zips.
          set -o pipefail
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                 -project BassPlayer.xcodeproj \
                 -scheme "${{ matrix.scheme }}" \
                 -clonedSourcePackagesDirPath SourcePackages \
                 -skipMacroValidation > resolve.log 2>&1; then
              tail -n 30 resolve.log
              exit 0
            fi
            echo "resolve attempt $attempt failed:"
            grep -E "error|failed" resolve.log | cut -c1-300 | head -5
          done
          tail -n 40 resolve.log
          exit 1

      - name: Build ${{ matrix.name }} (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BassPlayer.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build-${{ matrix.suffix }}.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-${{ matrix.suffix }}.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "${{ matrix.app }}" -type d | head -n1)
          test -n "$APP" || { echo "No .app found"; exit 1; }
          echo "App at: $APP"
          du -sh "$APP"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")"
          ls -lh "$BIN"
          if strings "$BIN" | grep -q "avcodec_open2\|avformat_open_input"; then echo "FFmpeg: linked"; else echo "FFmpeg: NOT FOUND in binary"; fi
          ls "$APP/Frameworks" 2>/dev/null || echo "(no embedded frameworks)"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          zip -qry "BassPlayer-${VERSION}-${{ matrix.suffix }}-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BassPlayer-${{ matrix.suffix }}-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.suffix }}
          path: build-${{ matrix.suffix }}.log

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
