name: Build visionOS IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i xros || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for visionOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BassPlayer.xcodeproj \
            -scheme BassPlayer \
            -configuration Release \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee build.log | grep -E "error:|warning: .*BassPlayer|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "BassPlayer.app" -type d | head -n1)
          test -n "$APP" || { echo "No .app found"; exit 1; }
          echo "App at: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          zip -qry "BassPlayer-${VERSION}-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BassPlayer-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.ipa"
